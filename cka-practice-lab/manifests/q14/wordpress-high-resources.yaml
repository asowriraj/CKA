apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: relative-fawn
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      initContainers:
      - name: init-container
        image: busybox:1.36.1
        command: ["sh", "-c", "echo 'Initializing...' && sleep 60"]
        resources:
          limits:
            cpu: "2500m"
            memory: "2600Mi"
          requests:
            cpu: "2000m"
            memory: "2000Mi"
      containers:
      - name: wordpress-container
        image: wordpress:php8.2-apache
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "2500m"
            memory: "2600Mi"
          requests:
            cpu: "2000m"
            memory: "2000Mi"
