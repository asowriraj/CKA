apiVersion: apps/v1
kind: Deployment
metadata:
  name: synergy-leverager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synergy-leverager
  template:
    metadata:
      labels:
        app: synergy-leverager
    spec:
      containers:
      - name: synergy-leverager
        image: busybox:1.36.1
        command:
        - /bin/sh
        - -c
        - |
          i=0
          while true; do
            echo "$(date) INFO Log entry $i" >> /var/log/synergy-leverager.log
            i=$((i+1))
            sleep 5
          done
        # Note: No volumeMounts initially - student must add them
